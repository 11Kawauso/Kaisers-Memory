<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaiser's Room | Kaiser's Memory</title>
    <link rel="icon" type="image/png" href="/images/kaiser/idle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Orbitron:wght@500;700&display=swap"

  <body class="room">
    <a class="room-back btn" href="index.html" data-i18n="back"></a>

      <div class="room-holo holo">

      <div class="room-floor" aria-hidden="true"></div>
      <button id="kaiser" class="room-kaiser" type="button" data-i18n-label="talkToKaiser">
        <img alt="" draggable="false" />
      </button>
    </div>

    <div id="dialogue-root" class="room-dialogue"></div>

    <script type="module" src="/src/room.ts"></script>
